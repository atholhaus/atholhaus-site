:root{--ink:#171522;--cream:#fffaf0;--green:#632bff;--accent:#dfff57;--muted:#514b5e;--pink:#ff4eae;--orange:#ff7049;--blue:#4367ff}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.55}header,main,footer{max-width:1100px;margin:auto;padding:24px}header{border-bottom:2px solid var(--ink);display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-size:1.7rem;font-weight:900;letter-spacing:-.065em;text-decoration:none;color:inherit}header a.back{color:var(--muted);font-weight:600;text-decoration:none;font-size:.9rem}header a.back:hover{color:var(--green);text-decoration:underline}h1{font-size:clamp(2.7rem,7vw,5.7rem);line-height:1.04;letter-spacing:-.065em;margin:14px 0 22px}h2{font-size:clamp(2rem,5vw,3.6rem);line-height:1.12;letter-spacing:-.05em;margin:10px 0 18px}.eyebrow{font-size:.78rem;letter-spacing:.15em;text-transform:uppercase;color:var(--green);font-weight:900}.lead{font-size:1.18rem;max-width:680px}.stage{min-height:64vh;padding:55px 0}.card{background:#fff;border:2px solid var(--ink);border-radius:26px;padding:clamp(22px,5vw,48px);box-shadow:9px 9px 0 var(--pink);max-width:820px;margin:20px auto 35px}.btn{border:2px solid var(--ink);border-radius:100px;background:var(--ink);color:white;font:800 1rem system-ui;padding:13px 24px;cursor:pointer;box-shadow:5px 5px 0 var(--orange)}.btn:hover{transform:translateY(-2px)}.btn.alt{background:var(--accent);color:var(--ink);box-shadow:5px 5px 0 var(--blue)}.btn:disabled{opacity:.35;cursor:not-allowed}.options{display:grid;gap:11px;margin:25px 0}.opt{border:2px solid var(--ink);border-radius:16px;padding:14px 18px;cursor:pointer;display:flex;gap:12px;align-items:center;background:white;font-weight:650}.opt:hover{background:#f4edff}.opt.selected{background:var(--accent);box-shadow:4px 4px 0 var(--blue)}.opt input{accent-color:var(--green);width:18px;height:18px}textarea{display:block;width:100%;min-height:95px;padding:14px;border:2px solid var(--ink);border-radius:13px;font:inherit;resize:vertical;background:white}.muted{color:var(--muted)}.actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:25px}.progress{height:9px;border:2px solid var(--ink);border-radius:30px;overflow:hidden;margin:18px 0 25px}.fill{height:100%;background:var(--green);transition:width .2s}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.note{background:var(--accent);border:2px solid var(--ink);border-radius:22px 60px 22px 22px;padding:24px;margin:24px 0;max-width:690px}.illustration{max-width:210px;width:40%;float:right;margin:0 0 15px 20px}footer{border-top:2px solid var(--ink);font-size:.86rem;color:var(--muted)}a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:3px}@media(max-width:650px){header,main,footer{padding:18px}.stage{padding:32px 0}.illustration{float:none;display:block;margin:0 auto 15px;width:60%}.card{box-shadow:6px 6px 0 var(--pink)}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.snapshot{max-width:980px;margin:0 auto 50px}.snapshot h1{font-size:clamp(2.8rem,6vw,5rem)}.snapshot-intro{max-width:780px}.snapshot-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:28px 0}.snapshot-panel{background:white;border:2px solid var(--ink);border-radius:22px;padding:24px;box-shadow:5px 5px 0 var(--pink)}.snapshot-panel h3{font-size:1.55rem;letter-spacing:-.04em;line-height:1.15;margin:8px 0 14px}.snapshot-panel p{margin:10px 0}.snapshot-panel .eyebrow{font-size:.72rem}.snapshot-panel.wide{grid-column:1/-1}.snapshot-panel:nth-child(2){box-shadow:5px 5px 0 var(--accent)}.snapshot-panel:nth-child(3){box-shadow:5px 5px 0 var(--blue)}.snapshot-item{padding:14px 0;border-top:1px solid #ddd7e3}.snapshot-item:first-of-type{border-top:0}.snapshot-item strong{display:block;margin-bottom:5px}.snapshot-item small{display:block;color:var(--muted);margin-top:8px;font-size:.84rem}.snapshot-actions{display:flex;flex-wrap:wrap;gap:16px;margin:25px 0}.snapshot-disclaimer{border-left:4px solid var(--green);padding:12px 18px;background:#f4edff}.snapshot-empty{color:var(--muted);font-style:italic}@media(max-width:700px){.snapshot-grid{grid-template-columns:1fr}.snapshot-panel.wide{grid-column:auto}}@media print{header,footer,.snapshot-actions{display:none!important}.snapshot-panel{box-shadow:none!important;break-inside:avoid}body{background:white}.snapshot{max-width:none}.stage{padding:0}}.deep-theme{border-top:2px solid #e6e0ea;padding:22px 0}.deep-theme h4{font-size:1.35rem;letter-spacing:-.035em;margin:7px 0}.deep-evidence{background:#f8f5fc;border-radius:14px;padding:14px 18px;margin:12px 0}.deep-evidence ul{margin:8px 0;padding-left:20px}.deep-evidence li{margin:8px 0}.deep-evidence li strong{display:inline}.deep-theme p{max-width:780px}.service-pathway{background:var(--accent);border:2px solid var(--ink);border-radius:26px;padding:clamp(24px,5vw,46px);margin:35px 0;box-shadow:8px 8px 0 var(--ink)}.service-pathway h2{max-width:720px}.service-pathway .eyebrow{color:var(--ink)}.service-pathway .lead{font-weight:650}.pathway-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:28px 0}.pathway-steps>div{border-top:2px solid var(--ink);padding-top:14px}.pathway-steps p{margin:8px 0}.pathway-link{display:inline-block;color:var(--ink);font-weight:800;margin:16px;text-underline-offset:4px}.service-pathway .muted{margin-top:22px}@media(max-width:700px){.pathway-steps{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="/">atholhaus.</a><a class="back" href="/">← Back to atholhaus</a></header><main><div id="app"></div></main><footer>atholhaus. · Culture is alive. · This preview saves answers only in your browser. Nothing is submitted.</footer><script>
const DATA={"q":[["The Vibe","Handshakes or High Fives?","What's the everyday energy like?",["Polished and professional","Casual and friendly","Depends on the situation","A bit of everything"]],["The Vibe","Hustle or Harmony?","When things get busy, what does great work look like?",["We push until it's done","Intense work with recovery","Efficiency over extra hours","People find their own rhythm","Depends on the season"]],["The Vibe","Suits or Sneakers?","How much room do people have to show up as themselves?",["Clear professional expectations","Individual expression is encouraged","Varies by role","We're reconsidering our norms"]],["The Vibe","Heroes or Helping Hands?","Who tends to get the biggest applause?",["Standout individual performers","Teams that deliver together","People who support others","People who prevent problems","All of the above"]],["The People","Cheers or Crickets?","Someone just accomplished something wonderful. What happens next?",["We celebrate publicly","A personal thank-you","A meaningful reward","Recognition happens informally","We could improve here"]],["The People","Spotlights or Shout-outs?","How do you figure out what makes people feel appreciated?",["We ask directly","Managers learn preferences","Consistent recognition programs","We assume similar preferences","We haven't explored this"]],["The People","Open Doors or Office Hours?","How easy is it to have a genuine conversation with leadership?",["Anyone can reach out","Regular scheduled conversations","Through managers","Varies by leader","We're improving accessibility"]],["The People","Traditions or Transitions?","What makes your workplace feel like your workplace?",["Shared traditions","Our mission and values","Relationships","Constant change and ideas","We're still discovering"]],["The Way You Work","Pings or In-Person?","How does your team stay connected and in the loop?",["Slack, Teams, or similar","Face-to-face conversations","Email","Text messages","A mix of everything","Varies by team"]],["The Way You Work","Meetings or Messages?","How does everyone get on the same page for decisions?",["We talk together","Digital discussion","Leaders decide and communicate","Clear decision-making process","Depends on the decision"]],["The Way You Work","Freedom or Frameworks?","How much room do people have to decide how they work?",["Lots of independence","Processes with room for judgment","Established procedures","Varies by role","Working toward autonomy"]],["The Way You Work","Speak Up or Stay Quiet?","When someone disagrees, what usually happens?",["We welcome conversation","Talk to their manager","Established feedback channels","Depends on topic or leader","People sometimes hesitate"]],["The Messy Middle","Fumbles or Fixes?","When someone makes a mistake, what's the first instinct?",["Solve the immediate problem","Understand what happened","Follow accountability process","Help the person learn","Depends on impact"]],["The Messy Middle","Rally or Recharge?","When pressure is on, how does your team get through it?",["Everyone pitches in","Leaders reprioritize","Established processes","Protect breaks and recovery","Push through until it settles"]],["The Messy Middle","Growing Pains or Growing Gains?","What's been the trickiest part of evolving?",["Keeping connected","Developing managers","Hiring and retention","Better systems","Preserving what's special","Several of these"]],["The Messy Middle","Rules or Relationships?","When someone's circumstances don't fit a policy, what happens?",["Follow policy consistently","Consider circumstances","Find a fair balance","Managers have discretion","Need clearer guidance"]],["The Road Ahead","Perks or Purpose?","What makes people excited to work here?",["Meaningful work","Great colleagues","Compensation and benefits","Flexibility","Career growth","We're curious ourselves"]],["The Road Ahead","Big Ideas or Baby Steps?","When someone has a different idea, what happens?",["Encourage experimentation","Small-scale tests","Review process","Change from leadership","Ideas rarely become action"]],["The Road Ahead","Roots or Rockets?","What best describes this chapter of your story?",["Growing quickly","Strengthening what we've built","Reinventing ourselves","Navigating uncertainty","Stability and sustainability"]],["The Road Ahead","Magic Wand or Moving Mountains?","If you could change one thing about your workplace tomorrow, what would it be?",[]]],"s":[["The Friday 4:45","Something important goes sideways just before the weekend.",["Everyone jumps in","Someone delegates","Follow the process","If it can wait, it waits","Depends"]],["The Unsung Hero","Someone quietly goes above and beyond, but few notice.",["Manager recognizes them","Teammates celebrate","Next check-in","Might go unnoticed","Another approach"]],["The Big Oops","A well-liked employee makes an expensive mistake.",["Fix it together","Investigate first","Manager handles privately","Accountability process","Depends"]],["The New Voice","A brand-new employee questions a long-standing process.",["We love fresh ideas","Hear them out","Explain why","Build trust first","Depends"]],["The Burnout Signal","A usually enthusiastic employee seems exhausted.",["Manager checks in","Teammate reaches out","Review workload","Wait for them to ask","May not notice"]],["The Big Win","Your team lands a major client or completes a tough project.",["Company celebration","Personal thank-you","Bonus or time off","Quick acknowledgment","Team traditions"]],["The Great Disagreement","Two respected employees disagree about a big decision.",["Work it out directly","Manager facilitates","Leadership decides","Open discussion","May linger"]],["The Missing Memo","Employees hear about a change through the grapevine.",["Clarify quickly","Managers communicate","Review gap later","Happens too often","Usually prevented"]],["The Better Offer","A valued employee has a tempting offer elsewhere.",["Ask what would help them stay","Explore growth and pay","Respect decision","Examine what's missing","Depends"]],["The Unexpected Idea","An employee proposes an unconventional improvement.",["Try it","Small test","Established review","Rarely act quickly","Depends"]]],"chapterLines":{"The Vibe":"First impressions aren't everything. But they're something.","The People":"The good stuff. The humans.","The Way You Work":"Every workplace has a system. Even if the system is chaos.","The Messy Middle":"Because even the best workplaces have Mondays.","The Road Ahead":"Still becoming. Aren't we all?"}};const chapters=[...new Set(DATA.q.map(x=>x[0]))];const subtitles=DATA.chapterLines;let pos=-1,stage=1;const saved=JSON.parse(sessionStorage.getItem('atholhausCompassPreview')||'{}');const answers=saved.answers||{},notes=saved.notes||{};const app=document.getElementById('app');const safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){sessionStorage.setItem('atholhausCompassPreview',JSON.stringify({answers,notes}))}
const SNAPSHOT_RULES=[
{id:'recognition',title:'Recognition that reaches people',dimension:'Recognition & Belonging',strength:'Recognition appears to be part of everyday work, including how people celebrate contributions.',tension:'Recognition may not consistently reach people whose contributions are less visible.',opportunity:'Ask employees what meaningful appreciation looks like to them, then check whether quiet contributions are noticed.',positive:[['q4',[0,1,2,3]],['q5',[0,1]],['s1',[0,1]]],risk:[['q4',[4]],['q5',[3,4]],['s1',[3]]]},
{id:'voice',title:'Room to speak up',dimension:'Voice & Psychological Safety',strength:'There are signs that people can question established ways of working and be heard.',tension:'Speaking up may depend on who is listening or how long someone has been here.',opportunity:'Invite a newer employee to challenge a routine process, and follow up visibly on what happens to their idea.',positive:[['q11',[0,2]],['s3',[0,1]],['s6',[0,3]]],risk:[['q11',[3,4]],['s3',[2,3]],['s6',[4]]]},
{id:'sustainability',title:'Ambition with breathing room',dimension:'Performance & Sustainability',strength:'The responses suggest a willingness to balance demanding work with recovery and realistic priorities.',tension:'The team may rely on pushing through pressure, with signs of strain becoming visible only after the fact.',opportunity:'Discuss how teams notice overload early, redistribute urgent work, and recover after intense periods.',positive:[['q1',[1,2,3]],['q13',[1,2,3]],['s0',[1,2,3]],['s4',[0,1,2]]],risk:[['q1',[0]],['q13',[0,4]],['s0',[0]],['s4',[3,4]]]},
{id:'autonomy',title:'Trust and clear guardrails',dimension:'Autonomy & Accountability',strength:'People appear to have some latitude in how they deliver good work, with structures to support them.',tension:'Decision-making freedom may vary by role or depend on unclear expectations.',opportunity:'Identify which decisions employees can own, where approvals are necessary, and whether those boundaries are understood.',positive:[['q10',[0,1]],['q9',[0,1,3]],['s9',[0,1]]],risk:[['q10',[2,3,4]],['q9',[2]],['s9',[3]]]},
{id:'connection',title:'Communication people can rely on',dimension:'Communication & Connection',strength:'There are signs of intentional communication and timely clarification when information changes.',tension:'Important information may sometimes travel through informal channels before employees hear it directly.',opportunity:'Map how a meaningful decision is communicated, from leadership through managers to the people affected.',positive:[['q6',[0,1]],['q9',[0,1,3]],['s7',[0,1,4]]],risk:[['q6',[2,3]],['s7',[2,3]]]},
{id:'learning',title:'Learning when things go sideways',dimension:'Autonomy & Accountability',strength:'The organization appears inclined to understand mistakes and improve, rather than only assign blame.',tension:'Responses leave open whether mistakes lead to learning, consistent accountability, or both.',opportunity:'Walk through a recent mistake together. Look at the immediate response, fairness, learning, and any process changes.',positive:[['q12',[0,1,3]],['s2',[0,1]]],risk:[['q12',[2]],['s2',[2,3]]]},
{id:'change',title:'Ideas that can take root',dimension:'Purpose & Adaptability',strength:'Employees appear to have pathways for testing new ideas and adapting how work gets done.',tension:'New ideas may have trouble moving from conversation into action.',opportunity:'Choose one employee suggestion, agree on a small experiment, and close the loop with the person who raised it.',positive:[['q17',[0,1]],['s9',[0,1]]],risk:[['q17',[3,4]],['s9',[2,3]]]},
{id:'fairness',title:'Consistency with humanity',dimension:'Recognition & Belonging',strength:'There are signs of thoughtful efforts to balance consistent expectations with individual circumstances.',tension:'Different managers may handle similar situations differently, leaving fairness hard to predict.',opportunity:'Review a few anonymized exceptions to policy and agree on consistent, lawful principles for decisions.',positive:[['q15',[1,2]]],risk:[['q15',[3,4]]]}
];
function snapshotData(){const selected=(prefix,i)=>{const item=prefix==='q'?DATA.q[i]:DATA.s[i];const choices=prefix==='q'?item[3]:item[2];return choices.indexOf(answers[prefix+i])};const findings=SNAPSHOT_RULES.map(rule=>{const evidence=[];let plus=0,minus=0;for(const [kind,groups] of [['positive',rule.positive],['risk',rule.risk]])for(const [key,indices] of groups){const prefix=key[0],i=Number(key.slice(1)),idx=selected(prefix,i);if(idx>=0&&indices.includes(idx)){if(kind==='positive')plus++;else minus++;evidence.push({source:prefix==='q'?'Discovery':'In action',question:prefix==='q'?DATA.q[i][1]:DATA.s[i][0],answer:answers[key],kind});}}return {...rule,plus,minus,evidence};});const filled=Array.from({length:20},(_,i)=>selected('q',i)>=0||Boolean((notes['q'+i]||'').trim())).filter(Boolean).length+Array.from({length:10},(_,i)=>selected('s',i)>=0||Boolean((notes['s'+i]||'').trim())).filter(Boolean).length;const strengths=findings.filter(x=>x.plus>=2&&x.plus>x.minus).sort((a,b)=>b.plus-a.plus).slice(0,3);const tensions=findings.filter(x=>x.minus>=1||(x.plus>=1&&x.minus>=1)).sort((a,b)=>b.minus-a.minus||b.plus-a.plus).slice(0,3);const opportunities=[...tensions,...findings.filter(x=>x.plus>=1&&!tensions.includes(x))].slice(0,3);return {filled,findings,strengths,tensions,opportunities};}

const DEEP_DIVE={
recognition:{meaning:'Recognition is not just celebration. It tells people which contributions count, including the invisible work that makes everyone else successful.',ask:'Who receives appreciation most often, and whose work might be easy to overlook?',try:'Ask three employees what kind of recognition actually feels meaningful. Compare their answers with what leaders usually do.'},
voice:{meaning:'An open door matters less than what happens after someone takes the risk of walking through it. The follow-through is what builds trust.',ask:'What happened the last time someone respectfully challenged a decision?',try:'Invite a new or quieter team member to question one routine practice, then share what changed or why it did not.'},
sustainability:{meaning:'High standards and sustainable work are not opposites. The question is whether intense periods are intentional, supported, and followed by recovery.',ask:'When did the team last experience a sustained crunch, and what happened afterward?',try:'Review one demanding week. Identify which work was truly urgent, who carried the load, and what recovery looked like.'},
autonomy:{meaning:'Autonomy thrives when people know what they own, where they can improvise, and when they need support. Too little clarity can feel like abandonment rather than freedom.',ask:'Which decisions can employees make without asking permission, and do managers agree?',try:'Write down three common decisions and clarify who owns each one, with room for professional judgment.'},
connection:{meaning:'A message being sent is not the same as a message being understood. Communication is a shared system, not just a leadership announcement.',ask:'How would a frontline employee describe the last important organizational change?',try:'Trace one recent announcement across roles and shifts. Ask whether people received it, understood it, and could ask questions.'},
learning:{meaning:'A healthy response to mistakes can combine care, accountability, and better systems. Being kind does not mean avoiding consequences.',ask:'What changed in the organization after the last meaningful mistake?',try:'Use a recent anonymized incident to review immediate response, fair accountability, and what the system learned.'},
change:{meaning:'A culture of innovation is shaped by what happens after an idea is offered. Even a respectful no can strengthen trust when the reasoning is clear.',ask:'Can employees name an idea from the team that actually changed how work gets done?',try:'Select one practical employee idea for a small, time-boxed experiment and report the result.'},
fairness:{meaning:'Consistency and compassion belong together. Fairness means applying clear principles while recognizing relevant circumstances and legal obligations.',ask:'Would two managers respond similarly to the same employee situation, and why?',try:'Discuss two anonymized policy exceptions and document the lawful principles guiding decisions.'}
};
function deepDiveMarkup(d){const ranked=d.findings.filter(x=>x.evidence.length).sort((a,b)=>(b.plus+b.minus)-(a.plus+a.minus));const details=ranked.slice(0,6);const selected=(key)=>answers[key]||'';const scenarioPairs=[{title:'Pressure versus recovery',q:'q13',s:'s4',prompt:'The way pressure is handled and the way burnout is noticed can tell different stories.'},{title:'Speaking up versus welcoming new voices',q:'q11',s:'s3',prompt:'A stated openness to disagreement is worth comparing with how a new employee is received.'},{title:'Celebration versus the quiet contributor',q:'q4',s:'s1',prompt:'Public recognition and the experience of less-visible contributors are not always the same.'},{title:'Ideas versus implementation',q:'q17',s:'s9',prompt:'Enthusiasm for new ideas is different from making space to test them.'},{title:'Communication versus the rumor mill',q:'q9',s:'s7',prompt:'Decision-making practices can be compared with what happens when employees hear news informally.'}].filter(x=>selected(x.q)&&selected(x.s)).slice(0,3);const noteEntries=Object.keys(notes).filter(k=>(notes[k]||'').trim()&&k!=='q19').slice(0,4);return '<article class="snapshot-panel wide"><div class="eyebrow">Below the surface</div><h3>A closer look at your culture</h3><p>These themes connect your responses to the everyday experiences they may create. Each is a conversation starter, not a conclusion.</p>'+ (details.length?details.map(x=>{const info=DEEP_DIVE[x.id];const signals=x.evidence.slice(0,3).map(e=>'<li><strong>'+safe(e.question)+'</strong> '+safe(e.answer)+'</li>').join('');const lead=x.minus&&x.plus?'Your answers contain both encouraging and cautionary signals here. That may reflect differences between situations, teams, or intentions and habits.':x.minus?'Some responses suggest this area may deserve attention. That does not establish that employees experience it the same way.':'Several responses suggest a promising foundation in this area. It is still worth checking whether that experience is shared.';return '<div class="deep-theme"><div class="eyebrow">'+safe(x.dimension)+'</div><h4>'+safe(x.title)+'</h4><p>'+safe(lead)+' '+safe(info.meaning)+'</p><div class="deep-evidence"><strong>What you told us</strong><ul>'+signals+'</ul></div><p><strong>A question worth asking:</strong> '+safe(info.ask)+'</p><p><strong>One practical experiment:</strong> '+safe(info.try)+'</p></div>'}).join(''):'<p class="snapshot-empty">Answer more prompts to reveal theme-by-theme interpretations.</p>')+'</article>'+(scenarioPairs.length?'<article class="snapshot-panel wide"><div class="eyebrow">Intentions meet real life</div><h3>Two sides of the same story</h3><p>These pairs do not prove consistency or contradiction. They give you a way to explore how values show up in practice.</p>'+scenarioPairs.map(x=>'<div class="snapshot-item"><strong>'+safe(x.title)+'</strong><p>'+safe(x.prompt)+'</p><p><span class="muted">Your approach:</span> '+safe(selected(x.q))+'</p><p><span class="muted">Your scenario response:</span> '+safe(selected(x.s))+'</p></div>').join('')+'</article>':'')+(noteEntries.length?'<article class="snapshot-panel wide"><div class="eyebrow">Beyond the multiple choice</div><h3>What you added in your own words</h3>'+noteEntries.map(k=>{const i=Number(k.slice(1)),question=k[0]==='q'?DATA.q[i][1]:DATA.s[i][0];return '<div class="snapshot-item"><strong>'+safe(question)+'</strong><p>'+safe(notes[k]).replace(/\n/g,'<br>')+'</p></div>'}).join('')+'</article>':'')+'<article class="snapshot-panel wide"><div class="eyebrow">From insight to action</div><h3>Your first 30 days of curiosity</h3><div class="snapshot-item"><strong>Week 1: Listen before changing anything</strong><p>Share two or three themes with a mix of employees and managers. Ask what resonates, what feels inaccurate, and what is missing.</p></div><div class="snapshot-item"><strong>Week 2: Follow one theme into real work</strong><p>Look at a recent decision, busy period, celebration, or mistake. Compare the process with how people actually experienced it.</p></div><div class="snapshot-item"><strong>Week 3: Try one small improvement</strong><p>'+(details.length?safe(DEEP_DIVE[details[0].id].try):'Choose a small, employee-informed improvement with a clear owner.')+'</p></div><div class="snapshot-item"><strong>Week 4: Close the loop</strong><p>Tell people what you heard, what changed, what did not, and what you are still learning. Culture keeps moving.</p></div></article>';}
function servicePathway(d){const themes=d.findings.filter(x=>x.evidence.length).sort((a,b)=>b.minus-a.minus||b.plus-a.plus);const top=themes[0];const focus=top?top.title.toLowerCase():'your evolving workplace';const subject='Culture Compass: Let’s talk about our results';const mail='mailto:hello@atholhaus.com?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent('Hello atholhaus,\n\nWe completed the Culture Compass and would like to explore what our results mean for our organization.\n\nOur starting point: '+focus+'.\n\nOrganization:\nContact name:\n\n');return '<section class="service-pathway"><div class="eyebrow">Where the conversation gets interesting</div><h2>Let’s put these insights to work.</h2><p class="lead">A questionnaire can reveal patterns. It cannot sit down with your people, understand the history behind those patterns, or help leaders decide what to do next. That’s where atholhaus comes in.</p><p>We can help validate what resonates, understand what may be missing, and turn cultural insight into practical HR and leadership support that fits your organization.</p><div class="pathway-steps"><div><strong>01 · Make sense of it</strong><p>Review your Culture Snapshot with an experienced HR partner and explore the context behind the findings.</p></div><div><strong>02 · Listen to the humans</strong><p>Understand how employees and leaders experience the culture, including the perspectives a questionnaire cannot capture.</p></div><div><strong>03 · Make it work</strong><p>Build a practical path forward through HR advisory, fractional leadership, or focused projects, depending on what you need.</p></div></div><a class="btn" href="'+mail+'">Let’s talk about your culture</a> <a class="pathway-link" href="/#services">Explore atholhaus services</a><p class="muted">No obligation. Just a conversation about where your organization is and where you want to take it.</p></section>';}function snapshotMarkup(){const d=snapshotData();const evidence=x=>'<small>Signals: '+x.evidence.slice(0,3).map(e=>safe(e.question)+' ('+safe(e.source)+')').join(' · ')+'</small>';const items=(list,kind)=>list.length?list.map(x=>'<div class="snapshot-item"><strong>'+safe(x.title)+'</strong><p>'+safe(kind==='strength'?x.strength:kind==='tension'?x.tension:x.opportunity)+'</p>'+(kind==='opportunity'?'':evidence(x))+'</div>').join(''):'<p class="snapshot-empty">Not enough specific signals yet. This is a question to explore, not a blank verdict.</p>';const wish=(notes.q19||'').trim();const contradictions=d.findings.filter(x=>x.plus>0&&x.minus>0).slice(0,2);return '<section class="stage snapshot"><div class="eyebrow">Your Culture Snapshot · A first conversation</div><h1>A culture in motion.</h1><p class="lead snapshot-intro">This is a starting interpretation of the patterns in your answers, not a score, diagnosis, or ranking. Every workplace is more interesting than a questionnaire.</p><p class="muted">Based on '+d.filled+' of 30 prompts with responses. Unanswered prompts are not treated as negative signals.</p><div class="snapshot-grid"><article class="snapshot-panel"><div class="eyebrow">What seems to be working</div><h3>Potential strengths</h3>'+items(d.strengths,'strength')+'</article><article class="snapshot-panel"><div class="eyebrow">Worth a closer look</div><h3>Possible tensions</h3>'+items(d.tensions,'tension')+'</article><article class="snapshot-panel wide"><div class="eyebrow">A place to begin</div><h3>Opportunities for conversation</h3>'+items(d.opportunities,'opportunity')+'</article>'+(contradictions.length?'<article class="snapshot-panel wide"><div class="eyebrow">Culture is complicated</div><h3>Signals worth comparing</h3><p>Some answers point in different directions. That can reflect differences between teams, intentions and everyday practice, or simply the limits of these questions.</p>'+contradictions.map(x=>'<div class="snapshot-item"><strong>'+safe(x.title)+'</strong>'+evidence(x)+'</div>').join('')+'</article>':'')+(wish?'<article class="snapshot-panel wide"><div class="eyebrow">In your own words</div><h3>The magic-wand wish</h3><p>'+safe(wish).replace(/\n/g,'<br>')+'</p></article>':'')+deepDiveMarkup(d)+'</div>'+servicePathway(d)+'<div class="snapshot-disclaimer"><strong>What this can and cannot tell us</strong><p>These are hypotheses from self-reported answers, not independently verified findings. They cannot establish how employees experience the workplace. A meaningful Culture Snapshot needs employee perspectives, context, and human review. Legal and compliance obligations are never matters of cultural preference.</p></div><div class="snapshot-actions"><button class="btn" id="printSnapshot">Save as PDF / Print</button><button class="btn alt" id="download">Download answers (JSON)</button><button class="btn alt" id="editAnswers">Review answers</button><button class="btn alt" id="restart">Start over</button></div><p class="muted">Your responses and this report stay in this browser. Nothing is sent to atholhaus.</p><p class="lead"><strong>AI understands the resources. We understand the humans.</strong></p></section>';}
function render(){let out='';if(pos===-1){out='<section class="stage"><img class="illustration" src="/atholhaus-robot-reading-transparent.png" alt="The approved atholhaus robot reading a book"><div class="eyebrow">The Culture Compass · A little curiosity goes a long way</div><h1>First, let’s get to know your world.</h1><p class="lead">Every organization has a culture. Some are highly curated. Others grow a little more organically. Most are somewhere in between.</p><p class="lead">We’re not here to tell you what kind of culture you should have. We’re here to understand the one you’ve built, how it shapes the experiences of your people, and how we can help it grow alongside your organization.</p><p class="lead">Some questions are practical. Some are a little peculiar. All of them help us get to know the humans behind the business.</p><p class="lead"><strong>No perfect answers. No personality types. Just a conversation.</strong></p><button class="btn" id="start">Shall we?</button><p class="muted">20 questions, then a few real-life scenarios. Take your time.</p></section>'}else if(pos===30){out=snapshotMarkup()}else{const scenario=pos>=20;const idx=scenario?pos-20:pos;const item=scenario?DATA.s[idx]:DATA.q[idx];const key=(scenario?'s':'q')+idx;const chapter=scenario?'Culture in Action':item[0];const first=pos===0||(pos<20&&DATA.q[pos-1][0]!==chapter)||pos===20;const count=pos+1;const chapterIntro=first?'<div class="note"><div class="eyebrow">'+(scenario?'The real-life test':'Chapter '+(chapters.indexOf(chapter)+1))+'</div><h2>'+safe(chapter)+'</h2><p>'+safe(scenario?'Culture isn’t just what we believe. It’s what we do. No trick questions, just familiar moments.':subtitles[chapter])+'</p></div>':'';const choices=item[3]||item[2];out='<section class="stage"><div class="top"><span class="eyebrow">'+(scenario?'Culture in Action':'Getting to Know Your World')+'</span><span class="muted">'+count+' / 30</span></div><div class="progress" aria-label="Progress"><div class="fill" style="width:'+(count/30*100)+'%"></div></div>'+chapterIntro+'<div class="card"><div class="eyebrow">'+safe(chapter)+'</div><h2>'+safe(scenario?item[0]:item[1])+'</h2><p class="lead">'+safe(scenario?item[1]:item[2])+'</p>'+(choices.length?'<div class="options">'+choices.map((v,i)=>'<label class="opt '+(answers[key]===v?'selected':'')+'"><input type="radio" name="choice" value="'+i+'" '+(answers[key]===v?'checked':'')+'><span>'+safe(v)+'</span></label>').join('')+'</div>':'')+'<label for="more" class="muted">'+(choices.length?'Anything else we should know? (Optional)':'Dream a little. We’re listening.')+'</label><textarea id="more" placeholder="There’s usually more to the story...">'+safe(notes[key]||'')+'</textarea><div class="actions"><button class="btn alt" id="prev">Back</button><button class="btn" id="next">'+(pos===29?'Finish':'Keep going')+'</button></div></div></section>'}app.innerHTML=out;window.scrollTo(0,0);document.getElementById('start')?.addEventListener('click',()=>{pos=0;render()});document.getElementById('prev')?.addEventListener('click',()=>{pos--;render()});document.getElementById('next')?.addEventListener('click',()=>{pos++;render()});document.querySelectorAll('input[name="choice"]').forEach(x=>x.addEventListener('change',()=>{const scenario=pos>=20,idx=scenario?pos-20:pos,item=scenario?DATA.s[idx]:DATA.q[idx],choices=item[3]||item[2];answers[(scenario?'s':'q')+idx]=choices[+x.value];persist();document.querySelectorAll('.opt').forEach(y=>y.classList.toggle('selected',y.contains(x)))}));document.getElementById('more')?.addEventListener('input',e=>{notes[(pos>=20?'s':'q')+(pos>=20?pos-20:pos)]=e.target.value;persist()});document.getElementById('download')?.addEventListener('click',()=>{const rows=[...DATA.q.map((x,i)=>({stage:'Getting to Know Your World',question:x[1],answer:answers['q'+i]||'',notes:notes['q'+i]||''})),...DATA.s.map((x,i)=>({stage:'Culture in Action',question:x[0],answer:answers['s'+i]||'',notes:notes['s'+i]||''}))];const blob=new Blob([JSON.stringify(rows,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='atholhaus-culture-compass-answers.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});document.getElementById('printSnapshot')?.addEventListener('click',()=>window.print());document.getElementById('editAnswers')?.addEventListener('click',()=>{pos=0;render()});document.getElementById('restart')?.addEventListener('click',()=>{sessionStorage.removeItem('atholhausCompassPreview');location.reload()})}render();
</script></body></html>
