-pathway .eyebrow{color:var(--ink)}.service-pathway .lead{font-weight:650}.pathway-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:28px 0}.pathway-steps>div{border-top:2px solid var(--ink);padding-top:14px}.pathway-steps p{margin:8px 0}.pathway-link{display:inline-block;color:var(--ink);font-weight:800;margin:16px;text-underline-offset:4px}.service-pathway .muted{margin-top:22px}@media(max-width:700px){.pathway-steps{grid-template-columns:1fr}}.visual-overview{margin:34px 0 40px;background:white;border:2px solid var(--ink);border-radius:26px;padding:clamp(22px,4vw,38px);box-shadow:7px 7px 0 var(--blue)}.visual-overview h2{font-size:clamp(2rem,4vw,3.3rem)}.visual-overview .lead{font-size:1.05rem}.visual-legend{display:flex;flex-wrap:wrap;gap:10px 20px;margin:24px 0 18px;font-size:.84rem;font-weight:650}.visual-legend span{display:inline-flex;align-items:center;gap:7px}.legend-dot,.signal-dot{display:inline-block;width:14px;height:14px;flex-shrink:0;border:2px solid var(--ink);border-radius:50%}.legend-dot.promising,.signal-tile.promising .signal-dot{background:var(--accent)}.legend-dot.explore,.signal-tile.explore .signal-dot{background:var(--orange)}.legend-dot.mixed,.signal-tile.mixed .signal-dot{background:var(--pink)}.legend-dot.unexplored,.signal-tile.unexplored .signal-dot{background:#e5e0e9}.signal-map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.signal-tile{display:flex;align-items:flex-start;gap:12px;padding:17px;border:2px solid var(--ink);border-radius:15px;background:#fffdf8}.signal-tile.promising{background:#f7ffde}.signal-tile.explore{background:#fff1e8}.signal-tile.mixed{background:#fff0f7}.signal-tile.unexplored{background:#f4f2f5}.signal-tile strong{font-size:.95rem;display:block;line-height:1.3}.signal-tile small{display:block;color:var(--muted);font-size:.78rem;margin-top:5px}.visual-footnote{color:var(--muted);font-size:.86rem;margin:17px 0 28px}.journey-wrap{border-top:2px solid #e9e3ed;padding-top:23px}.journey-wrap h3{font-size:1.4rem;letter-spacing:-.03em;margin:0 0 5px}.journey-wrap>p{color:var(--muted);font-size:.9rem}.journey-row{display:grid;grid-template-columns:minmax(120px,1.2fr) minmax(100px,2fr) 52px;align-items:center;gap:12px;margin:13px 0;font-size:.85rem;font-weight:650}.journey-row small{text-align:right;color:var(--muted)}.journey-blocks{display:flex;gap:4px}.journey-blocks i{flex:1;min-width:0;height:17px;border:1px solid var(--ink);border-radius:4px;background:#eeeaf1}.journey-blocks i.answered{background:var(--green)}@media(max-width:650px){.signal-map{grid-template-columns:1fr}.journey-row{grid-template-columns:1fr 1.2fr 40px;gap:7px;font-size:.76rem}.journey-blocks{gap:2px}.journey-blocks i{height:14px}}@media print{.visual-overview{box-shadow:none}.signal-tile,.journey-row{break-inside:avoid}}.contact-panel{background:white;border:2px solid var(--ink);border-radius:20px;padding:clamp(20px,4vw,32px);margin:30px 0;color:var(--ink)}.contact-panel h3{font-size:1.7rem;letter-spacing:-.04em;margin:0 0 8px}.contact-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px;margin:22px 0}.contact-panel label{display:block;font-weight:750;font-size:.9rem}.contact-panel input:not([type=checkbox]),.contact-panel select,.contact-panel textarea{display:block;width:100%;font:inherit;font-weight:450;border:2px solid var(--ink);border-radius:10px;padding:12px;margin-top:7px;background:white;color:var(--ink)}.contact-panel textarea{min-height:85px}.contact-panel .contact-consent{display:flex;align-items:flex-start;gap:9px;margin:20px 0;font-weight:550}.contact-consent input{margin-top:4px;accent-color:var(--green)}.contact-panel .muted{font-size:.84rem;margin-top:15px}@media(max-width:650px){.contact-fields{grid-template-columns:1fr}}@media print{.contact-panel{display:none}}</style></head><body><header><a class="brand" href="/">atholhaus.</a><a class="back" href="/">← Back to atholhaus</a></header><main><div id="app"></div></main><footer>atholhaus. · Culture is alive. · Answers stay in your browser until you explicitly submit them.</footer><script>
const DATA={"q":[["The Vibe & the Values","Handshakes or High-Fives?","How would you describe the everyday atmosphere?",["Handshakes. Professional, polished, and purposeful.","High-fives. Casual, connected, and collaborative.","A little of both. We read the room.","Neither. We do things our own way."]],["The Vibe & the Values","Suits or Sneakers?","How does your organization approach tradition and expectations?",["Tried-and-true. Structure keeps us grounded.","Rules are more like suggestions.","We respect tradition but aren't afraid to remix it.","It depends on the team and the situation."]],["The Vibe & the Values","Cheers or Checklists?","What usually gets someone recognized?",["Getting results and hitting goals.","Helping others and building relationships.","Bringing fresh ideas to the table.","Keeping things consistent and dependable.","Recognition varies and can be informal."]],["The Vibe & the Values","What's the Secret Sauce?","What's one thing about your workplace that makes it unmistakably yours?",[]],["Trust, Truth & Tough Conversations","Speak Up or Zip It?","When someone disagrees with leadership, what typically happens?",["People openly discuss it.","Disagreements happen, mostly behind closed doors.","People choose their battles carefully.","It depends on who's speaking."]],["Trust, Truth & Tough Conversations","Oops or Oh Shit?","When someone makes an honest mistake, what's the usual reaction?",["We get curious and figure out what happened.","We fix it first and talk about it later.","Accountability comes first.","It depends on the mistake or the person."]],["Trust, Truth & Tough Conversations","Questions or Quiet?","How comfortable are employees admitting they don't know something?",["Pretty comfortable. Questions are encouraged.","Comfortable with the right people.","People generally prefer to figure things out themselves.","Admitting uncertainty can feel risky."]],["Trust, Truth & Tough Conversations","Open Doors or Office Hours?","How accessible is leadership, really?",["Easy to approach, anytime.","Accessible, but through established channels.","It depends on the leader.","There's some distance between leadership and employees."]],["Freedom, Fuel & Finding Your Groove","Guardrails or Go-Karts?","How much freedom do people have to decide how their work gets done?",["Clear processes and expectations guide the work.","People have plenty of freedom to figure things out.","We provide direction and let people choose the route.","It depends on the role or manager."]],["Freedom, Fuel & Finding Your Groove","Passion or Paycheck?","What seems to keep people engaged?",["Purpose and meaningful work.","Compensation, benefits, and stability.","Relationships and belonging.","Learning, advancement, and new challenges.","Different people want different things."]],["Freedom, Fuel & Finding Your Groove","Climbing Ladders or Building Bridges?","How do people grow professionally?",["Clear paths for advancement.","Learning through collaboration and new experiences.","People largely create their own opportunities.","Growth happens when business needs allow."]],["Belonging, Bias & Being Human","Inner Circle or Open Invitation?","How easy is it for someone new or different to feel included?",["We make an intentional effort to include everyone.","People generally find their place over time.","It depends on the team or existing relationships.","Some people have a harder time breaking in."]],["Belonging, Bias & Being Human","Spotlight or Supporting Cast?","Who gets noticed when things go well?",["The people delivering the most visible results.","The whole team shares recognition.","Managers notice behind-the-scenes contributions.","Recognition is inconsistent or informal."]],["Belonging, Bias & Being Human","Fair Play or Favorites?","When opportunities arise, how are decisions typically made?",["Through clear criteria and transparent processes.","Based on leadership's judgment of who is ready.","Through relationships and informal conversations.","It depends on the opportunity."]],["Leaders, Legends & Lunchroom Lore","Megaphones or Murmurs?","How does important information usually travel?",["Through clear, consistent communication channels.","Through managers and team meetings.","Through informal conversations and word of mouth.","A little bit of everything, sometimes with mixed messages."]],["Leaders, Legends & Lunchroom Lore","Titles or Trailblazers?","Who really influences what happens?",["The people with formal leadership roles.","Trusted veterans and informal leaders.","Whoever has the right expertise.","Influence shifts depending on the situation."]],["Leaders, Legends & Lunchroom Lore","Help Desk or Helping Hands?","When employees need support, where do they turn first?",["Their direct manager.","A trusted coworker.","HR or another formal resource.","Whoever they know will get things done."]],["Growing Pains & Plot Twists","Playbook or Plot Twist?","When something unexpected happens, what's the usual response?",["Follow the established process.","Improvise and figure it out together.","Look to leadership for direction.","Try something new and adjust as we go."]],["Growing Pains & Plot Twists","Hustle or Harmony?","What does a particularly busy week feel like?",["Energizing. We thrive under pressure.","Focused. We know how to prioritize.","Chaotic. Everyone is juggling.","Exhausting. We get it done, but there's a cost.","It varies quite a bit."]],["Growing Pains & Plot Twists","Roots or Rocket Fuel?","If your organization doubled in size tomorrow, what's the one thing about your culture you'd refuse to lose?",[]]],"s":[["The Brilliant Jerk","Your highest performer delivers amazing results but regularly makes coworkers miserable. What happens?",["Leadership addresses the behavior directly, even if it risks losing the employee.","The employee gets coaching and a chance to improve.","The behavior is tolerated because the results are too valuable.","The team helps establish clearer expectations for working together."]],["The Meeting After the Meeting","Everyone agrees with a big decision in the meeting. Five minutes later, the hallway conversations begin. What happens?",["Leadership revisits the discussion and invites honest feedback.","Managers handle concerns individually.","The decision stands. Everyone had a chance to speak.","Informal leaders bring concerns back to decision-makers."]],["The Great Growth Spurt","Business is booming. Your informal ways of working aren't keeping up. What's the move?",["Introduce clearer processes, policies, and responsibilities.","Give teams freedom to develop their own solutions.","Examine what makes the culture special before changing things.","Bring in experienced people to help manage the growth."]],["The Oops Heard 'Round the Office","Someone makes an expensive mistake. Everyone knows about it. What happens next?",["Focus on fixing the problem and preventing another one.","Meet privately with the employee to understand what happened.","Examine whether the organization's systems contributed.","Evaluate individual accountability and appropriate consequences."]],["The New Kid Knows Something","A relatively new employee challenges a practice that's been around forever. What's the response?",["Invite them to explain their thinking.","Stick with the existing approach until there's strong evidence to change.","Try their suggestion on a small scale.","Let the responsible manager decide."]],["The Promotion Commotion","A beloved employee wants a promotion but isn't quite ready. What happens?",["Have an honest conversation and create a development plan.","Find another opportunity that better fits their strengths.","Give them a chance to grow into the role with support.","Hold off until they demonstrate the required capabilities."]],["The Deadline Dilemma","A major deadline is approaching. The team is exhausted. What's the call?",["Revisit the deadline or reduce the scope.","Push through, then provide recovery time.","Bring in help or redistribute the workload.","Involve the team in deciding what's realistically achievable."]],["The Fairness Fiasco","Two employees want the same opportunity. Both have strong arguments. How is the decision made?",["Use transparent, job-related criteria.","Let leadership determine who is best positioned to succeed.","Consider who would benefit most from the development opportunity.","Explore whether the opportunity can be shared or redesigned."]],["The Culture Collision","Two departments have completely different working styles, and tensions are rising. What happens?",["Leadership establishes common expectations.","The teams work together to find a compromise.","Managers address the immediate conflict.","Examine why the different working styles developed in the first place."]],["The Big, Bad, Unpopular Decision","Leadership has to make a decision employees probably won't like. What happens?",["Explain the situation and invite employee input before deciding.","Make the decision, then communicate the reasoning clearly.","Have managers explain the decision to their teams.","Involve employees in developing possible solutions."]]],"chapterLines":{"The Vibe & the Values":"Let's get acquainted. Every workplace has a personality, including yours.","Trust, Truth & Tough Conversations":"Things get interesting when people disagree, make mistakes, or have something uncomfortable to say.","Freedom, Fuel & Finding Your Groove":"What helps people do their best work? And what gets in the way?","Belonging, Bias & Being Human":"Culture isn't just about fitting in. It's also about who gets heard, recognized, and supported.","Leaders, Legends & Lunchroom Lore":"Every organization has an official structure. Then there's how things actually get done.","Growing Pains & Plot Twists":"Culture doesn't stand still. Neither does your business."}};const chapters=[...new Set(DATA.q.map(x=>x[0]))];const subtitles=DATA.chapterLines;let pos=-1,stage=1;const saved=JSON.parse(sessionStorage.getItem('atholhausCompassV2')||'{}');const answers=saved.answers||{},notes=saved.notes||{};const app=document.getElementById('app');const safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){sessionStorage.setItem('atholhausCompassV2',JSON.stringify({answers,notes}))}

{id:'connection',title:'Communication people can rely on',dimension:'Communication & Connection',strength:'There are signs of intentional communication and timely clarification when information changes.',tension:'Important information may sometimes travel through informal channels before employees hear it directly.',opportunity:'Map how a meaningful decision is communicated, from leadership through managers to the people affected.',positive:[["q14",[0,1]],["s9",[0,1,3]]],risk:[["q14",[2,3]],["s9",[2]]]},
{id:'learning',title:'Learning when things go sideways',dimension:'Autonomy & Accountability',strength:'The organization appears inclined to understand mistakes and improve, rather than only assign blame.',tension:'Responses leave open whether mistakes lead to learning, consistent accountability, or both.',opportunity:'Walk through a recent mistake together. Look at the immediate response, fairness, learning, and any process changes.',positive:[["q5",[0,1]],["s3",[0,1,2]]],risk:[["q5",[2,3]],["s3",[3]]]},
{id:'change',title:'Ideas that can take root',dimension:'Purpose & Adaptability',strength:'Employees appear to have pathways for testing new ideas and adapting how work gets done.',tension:'New ideas may have trouble moving from conversation into action.',opportunity:'Choose one employee suggestion, agree on a small experiment, and close the loop with the person who raised it.',positive:[["q17",[1,3]],["s4",[0,2]]],risk:[["q17",[0,2]],["s4",[1,3]]]},

function snapshotData(){const selected=(prefix,i)=>{const item=prefix==='q'?DATA.q[i]:DATA.s[i];const choices=prefix==='q'?item[3]:item[2];return choices.indexOf(answers[prefix+i])};const findings=SNAPSHOT_RULES.map(rule=>{const evidence=[];let plus=0,minus=0;for(const [kind,groups] of [['positive',rule.positive],['risk',rule.risk]])for(const [key,indices] of groups){const prefix=key[0],i=Number(key.slice(1)),idx=selected(prefix,i);if(idx>=0&&indices.includes(idx)){if(kind==='positive')plus++;else minus++;evidence.push({source:prefix==='q'?'Discovery':'In action',question:prefix==='q'?DATA.q[i][1]:DATA.s[i][0],answer:answers[key],kind});}}return {...rule,plus,minus,evidence};});const filled=Array.from({length:20},(_,i)=>selected('q',i)>=0||Boolean((notes['q'+i]||'').trim())).filter(Boolean).length+Array.from({length:10},(_,i)=>selected('s',i)>=0||Boolean((notes['s'+i]||'').trim())).filter(Boolean).length;const strengths=findings.filter(x=>x.plus>=2&&x.plus>x.minus).sort((a,b)=>b.plus-a.plus).slice(0,3);const tensions=findings.filter(x=>x.minus>=1||(x.plus>=1&&x.minus>=1)).sort((a,b)=>b.minus-a.minus||b.plus-a.plus).slice(0,3);const opportunities=[...tensions,...findings.filter(x=>x.plus>=1&&!tensions.includes(x))].slice(0,3);return {filled,findings,strengths,tensions,opportunities};}

fairness:{meaning:'Consistency and compassion belong together. Fairness means applying clear principles while recognizing relevant circumstances and legal obligations.',ask:'Would two managers respond similarly to the same employee situation, and why?',try:'Discuss two anonymized policy exceptions and document the lawful principles guiding decisions.'}
};
function deepDiveMarkup(d){const ranked=d.findings.filter(x=>x.evidence.length).sort((a,b)=>(b.plus+b.minus)-(a.plus+a.minus));const details=ranked.slice(0,6);const selected=(key)=>answers[key]||'';const scenarioPairs=[{title:'Pressure versus recovery',q:'q18',s:'s6',prompt:'The way pressure is handled and the way burnout is noticed can tell different stories.'},{title:'Speaking up versus welcoming new voices',q:'q4',s:'s4',prompt:'A stated openness to disagreement is worth comparing with how a new employee is received.'},{title:'Celebration versus the quiet contributor',q:'q12',s:'s0',prompt:'Public recognition and the experience of less-visible contributors are not always the same.'},{title:'Ideas versus implementation',q:'q17',s:'s4',prompt:'Enthusiasm for new ideas is different from making space to test them.'},{title:'Communication versus the rumor mill',q:'q14',s:'s9',prompt:'Decision-making practices can be compared with what happens when employees hear news informally.'}].filter(x=>selected(x.q)&&selected(x.s)).slice(0,3);const noteEntries=Object.keys(notes).filter(k=>(notes[k]||'').trim()&&k!=='q19').slice(0,4);return '<article class="snapshot-panel wide"><div class="eyebrow">Below the surface</div><h3>A closer look at your culture</h3><p>These themes connect your responses to the everyday experiences they may create. Each is a conversation starter, not a conclusion.</p>'+ (details.length?details.map(x=>{const info=DEEP_DIVE[x.id];const signals=x.evidence.slice(0,3).map(e=>'<li><strong>'+safe(e.question)+'</strong> '+safe(e.answer)+'</li>').join('');const lead=x.minus&&x.plus?'Your answers contain both encouraging and cautionary signals here. That may reflect differences between situations, teams, or intentions and habits.':x.minus?'Some responses suggest this area may deserve attention. That does not establish that employees experience it the same way.':'Several responses suggest a promising foundation in this area. It is still worth checking whether that experience is shared.';return '<div class="deep-theme"><div class="eyebrow">'+safe(x.dimension)+'</div><h4>'+safe(x.title)+'</h4><p>'+safe(lead)+' '+safe(info.meaning)+'</p><div class="deep-evidence"><strong>What you told us</strong><ul>'+signals+'</ul></div><p><strong>A question worth asking:</strong> '+safe(info.ask)+'</p><p><strong>One practical experiment:</strong> '+safe(info.try)+'</p></div>'}).join(''):'<p class="snapshot-empty">Answer more prompts to reveal theme-by-theme interpretations.</p>')+'</article>'+(scenarioPairs.length?'<article class="snapshot-panel wide"><div class="eyebrow">Intentions meet real life</div><h3>Two sides of the same story</h3><p>These pairs do not prove consistency or contradiction. They give you a way to explore how values show up in practice.</p>'+scenarioPairs.map(x=>'<div class="snapshot-item"><strong>'+safe(x.title)+'</strong><p>'+safe(x.prompt)+'</p><p><span class="muted">Your approach:</span> '+safe(selected(x.q))+'</p><p><span class="muted">Your scenario response:</span> '+safe(selected(x.s))+'</p></div>').join('')+'</article>':'')+(noteEntries.length?'<article class="snapshot-panel wide"><div class="eyebrow">Beyond the multiple choice</div><h3>What you added in your own words</h3>'+noteEntries.map(k=>{const i=Number(k.slice(1)),question=k[0]==='q'?DATA.q[i][1]:DATA.s[i][0];return '<div class="snapshot-item"><strong>'+safe(question)+'</strong><p>'+safe(notes[k]).replace(/\n/g,'<br>')+'</p></div>'}).join('')+'</article>':'')+'<article class="snapshot-panel wide"><div class="eyebrow">From insight to action</div><h3>Your first 30 days of curiosity</h3><div class="snapshot-item"><strong>Week 1: Listen before changing anything</strong><p>Share two or three themes with a mix of employees and managers. Ask what resonates, what feels inaccurate, and what is missing.</p></div><div class="snapshot-item"><strong>Week 2: Follow one theme into real work</strong><p>Look at a recent decision, busy period, celebration, or mistake. Compare the process with how people actually experienced it.</p></div><div class="snapshot-item"><strong>Week 3: Try one small improvement</strong><p>'+(details.length?safe(DEEP_DIVE[details[0].id].try):'Choose a small, employee-informed improvement with a clear owner.')+'</p></div><div class="snapshot-item"><strong>Week 4: Close the loop</strong><p>Tell people what you heard, what changed, what did not, and what you are still learning. Culture keeps moving.</p></div></article>';}
function servicePathway(d){return '<section class="service-pathway" id="talk"><div class="eyebrow">Where the conversation gets interesting</div><h2>Let’s put these insights to work.</h2><p class="lead">A questionnaire can reveal patterns. Understanding what they mean for your people, and what to do next, takes a conversation.</p><div class="pathway-steps"><div><strong>01 · Make sense of it</strong><p>Review your Culture Snapshot with an experienced HR partner.</p></div><div><strong>02 · Listen to the humans</strong><p>Explore employee and leadership experiences beyond the questionnaire.</p></div><div><strong>03 · Make it work</strong><p>Find the right fit through HR advisory, fractional leadership, or focused projects.</p></div></div><div class="contact-panel"><h3>Curious what comes next?</h3><p>Tell us a little about your organization. We’ll prepare an email you can review and send to atholhaus. Nothing is sent automatically.</p><form id="snapshotContact"><div class="contact-fields"><label>Your name<input name="contactName" autocomplete="name" required maxlength="100" placeholder="Your name"></label><label>Work email<input name="contactEmail" type="email" autocomplete="email" required maxlength="160" placeholder="you@organization.com"></label><label>Organization<input name="organization" autocomplete="organization" required maxlength="140" placeholder="Your organization"></label><label>What would be helpful?<select name="interest"><option>Understanding our Culture Snapshot</option><option>HR advisory and ongoing support</option><option>Fractional HR leadership</option><option>A focused HR or culture project</option><option>Not sure yet, let’s talk</option></select></label></div><label class="contact-message">Anything you want us to know?<textarea name="message" maxlength="700" placeholder="What’s happening in your organization? (Optional)"></textarea></label><label class="contact-consent"><input name="includeSummary" type="checkbox" checked> Include a short summary of my Culture Snapshot in the email</label><button class="btn" type="submit">Prepare my introduction</button><p id="contactStatus" class="muted" aria-live="polite">Opens your email app with a draft. You choose whether to send it.</p></form></div><a class="pathway-link" href="/#services">Explore atholhaus services</a></section>';}
function contactDraft(d,form){const data=new FormData(form);const get=k=>String(data.get(k)||'').trim();const lines=['Hello atholhaus,','','I completed Culture Compass and would like to explore working together.','','Name: '+get('contactName'),'Work email: '+get('contactEmail'),'Organization: '+get('organization'),'Interested in: '+get('interest')];if(get('message'))lines.push('','A little context:',get('message'));if(data.has('includeSummary')){lines.push('','My Culture Snapshot (self-reported, preliminary):','Promising themes: '+(d.strengths.map(x=>x.title).join('; ')||'Not enough signals yet'),'Themes to explore: '+(d.tensions.map(x=>x.title).join('; ')||'Not enough signals yet'));const wish=(notes.q19||'').trim();if(wish)lines.push('One thing I would protect: '+wish.slice(0,280));}lines.push('','I look forward to connecting.');const subject='Culture Compass conversation | '+get('organization');const href='mailto:hello@atholhaus.com?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(lines.join('\n'));const status=document.getElementById('contactStatus');if(href.length>1800){status.textContent='The draft is a little long for some email apps. Try shortening your note or unchecking the summary.';return;}status.textContent='Your email app should open with a draft. Please review it and press Send there. Nothing has been submitted through this website.';window.location.href=href;}
function visualSnapshot(d){const status=x=>!x.evidence.length?['unexplored','Not explored']:x.plus&&x.minus?['mixed','Mixed signals']:x.minus?['explore','Worth exploring']:['promising','Encouraging signals'];const tiles=d.findings.map(x=>{const [type,label]=status(x);return '<div class="signal-tile '+type+'"><span class="signal-dot"></span><div><strong>'+safe(x.title)+'</strong><small>'+label+'</small></div></div>'}).join('');return '<section class="visual-overview" aria-label="Visual overview of Culture Compass responses"><div class="eyebrow">At a glance</div><h2>Your culture, in signals.</h2><p class="lead">Not a scorecard. A map of themes your responses bring into view, with room for nuance.</p><div class="visual-legend"><span><i class="legend-dot promising"></i> Encouraging signals</span><span><i class="legend-dot explore"></i> Worth exploring</span><span><i class="legend-dot mixed"></i> Mixed signals</span><span><i class="legend-dot unexplored"></i> Not explored</span></div><div class="signal-map">'+tiles+'</div><p class="visual-footnote">These categories describe patterns in your answers, not verified employee experiences or ratings of cultural health. Mixed signals invite curiosity, not judgment.</p></section>';}const SUBMISSION_ENDPOINT='https://api.web3forms.com/submit';const SUBMISSION_ACCESS_KEY=['c537386b','b4bb','4b41','b0f0','5d153e4ff7c0'].join('-');let pdfUnlocked=false;
function submissionGate(){return '<section class="stage snapshot"><div class="eyebrow">Your Culture Snapshot</div><h1>A culture in motion.</h1><p class="lead">Your first look at the cultural signals in your answers.</p>'+visualSnapshot(snapshotData())+'<div class="contact-panel"><h2>Unlock your complete Culture Snapshot.</h2><p>Submit your information to receive the full analysis and printable PDF. atholhaus will receive your organization details, all assessment responses, written comments, and findings. A consultation is optional.</p><form id="snapshotSubmission"><div class="contact-fields"><label>Name<input name="name" required autocomplete="name"></label><label>Work email<input name="email" type="email" required autocomplete="email"></label><label>Organization<input name="organization" required autocomplete="organization"></label><label>Industry<input name="industry" required></label><label>Employee count<select name="employees" required><option value="">Choose</option><option>1-10</option><option>11-50</option><option>51-200</option><option>201-500</option><option>501-1000</option><option>1001+</option></select></label><label>Your role<input name="role"></label></div><label class="contact-consent"><input type="checkbox" required> I agree to share my organization information and assessment responses with atholhaus for follow-up and aggregated analysis. I have not included confidential employee information.</label><button class="btn" type="submit">Submit &amp; Get My Culture Snapshot</button><p id="submissionStatus" class="muted" role="status">Your report unlocks after successful submission.</p></form></div><button class="btn alt" id="editAnswers">Review answers</button></section>';}
async function submitAssessment(form){const status=document.getElementById('submissionStatus');if(!SUBMISSION_ENDPOINT){status.textContent='Secure email delivery is not connected yet. Your answers remain in this browser.';return;}const fields=Object.fromEntries(new FormData(form).entries());const snap=snapshotData();const compact=x=>({theme:x.title,dimension:x.dimension,interpretation:x.strength,concern:x.tension,opportunity:x.opportunity,evidence:x.evidence});const payload={submitted_at:new Date().toISOString(),assessment_version:'culture-compass-v2-2026-11',completion:{answered:snap.filled,total:30},answers:[...DATA.q.map((x,i)=>({stage:'Discovery',question:x[1],answer:answers['q'+i]||'',notes:notes['q'+i]||''})),...DATA.s.map((x,i)=>({stage:'Culture in Action',question:x[0],answer:answers['s'+i]||'',notes:notes['s'+i]||''}))],culture_snapshot:{strengths:snap.strengths.map(compact),tensions:snap.tensions.map(compact),opportunities:snap.opportunities.map(compact)}};const button=form.querySelector('button');button.disabled=true;status.textContent='Sending…';try{const response=await fetch(SUBMISSION_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({access_key:SUBMISSION_ACCESS_KEY,subject:'Culture Compass | '+fields.organization,from_name:'atholhaus Culture Compass',replyto:fields.email,email:fields.email,name:fields.name,organization:fields.organization,industry:fields.industry,employees:fields.employees,role:fields.role||'',assessment:JSON.stringify(payload,null,2)})});const result=await response.json();if(!response.ok||!result.success)throw Error(result.message||'Failed');pdfUnlocked=true;render();}catch(e){button.disabled=false;status.textContent='Could not confirm delivery. Please try again.';}}
function snapshotMarkup(){if(!pdfUnlocked)return submissionGate();const d=snapshotData();const evidence=x=>'<small>Signals: '+x.evidence.slice(0,3).map(e=>safe(e.question)+' ('+safe(e.source)+')').join(' · ')+'</small>';const items=(list,kind)=>list.length?list.map(x=>'<div class="snapshot-item"><strong>'+safe(x.title)+'</strong><p>'+safe(kind==='strength'?x.strength:kind==='tension'?x.tension:x.opportunity)+'</p>'+(kind==='opportunity'?'':evidence(x))+'</div>').join(''):'<p class="snapshot-empty">Not enough specific signals yet. This is a question to explore, not a blank verdict.</p>';const wish=(notes.q19||'').trim();const contradictions=d.findings.filter(x=>x.plus>0&&x.minus>0).slice(0,2);return '<section class="stage snapshot"><div class="eyebrow">Your Culture Snapshot · A first conversation</div><h1>A culture in motion.</h1><p class="lead snapshot-intro">This is a starting interpretation of the patterns in your answers, not a score, diagnosis, or ranking. Every workplace is more interesting than a questionnaire.</p><p class="muted">Based on '+d.filled+' of 30 prompts with responses. Unanswered prompts are not treated as negative signals.</p>'+visualSnapshot(d)+'<div class="snapshot-grid"><article class="snapshot-panel"><div class="eyebrow">What seems to be working</div><h3>Potential strengths</h3>'+items(d.strengths,'strength')+'</article><article class="snapshot-panel"><div class="eyebrow">Worth a closer look</div><h3>Possible tensions</h3>'+items(d.tensions,'tension')+'</article><article class="snapshot-panel wide"><div class="eyebrow">A place to begin</div><h3>Opportunities for conversation</h3>'+items(d.opportunities,'opportunity')+'</article>'+(contradictions.length?'<article class="snapshot-panel wide"><div class="eyebrow">Culture is complicated</div><h3>Signals worth comparing</h3><p>Some answers point in different directions. That can reflect differences between teams, intentions and everyday practice, or simply the limits of these questions.</p>'+contradictions.map(x=>'<div class="snapshot-item"><strong>'+safe(x.title)+'</strong>'+evidence(x)+'</div>').join('')+'</article>':'')+(wish?'<article class="snapshot-panel wide"><div class="eyebrow">In your own words</div><h3>What we would protect</h3><p>'+safe(wish).replace(/\n/g,'<br>')+'</p></article>':'')+deepDiveMarkup(d)+'</div>'+servicePathway(d)+'<div class="snapshot-disclaimer"><strong>What this can and cannot tell us</strong><p>These are hypotheses from self-reported answers, not independently verified findings. They cannot establish how employees experience the workplace. A meaningful Culture Snapshot needs employee perspectives, context, and human review. Legal and compliance obligations are never matters of cultural preference.</p></div><div class="snapshot-actions"><button class="btn" id="printSnapshot">Save as PDF / Print</button><button class="btn alt" id="download">Download answers (JSON)</button><button class="btn alt" id="editAnswers">Review answers</button><button class="btn alt" id="restart">Start over</button></div><p class="muted">Your answers were submitted to atholhaus to unlock this report. Save a PDF or download your answers for your records.</p><p class="lead"><strong>AI understands the resources. We understand the humans.</strong></p></section>';}
function render(){let out='';if(pos===-1){out='<section class="stage"><img class="illustration" src="/atholhaus-robot-reading-transparent.png" alt="The approved atholhaus robot reading a book"><div class="eyebrow">The Culture Compass · A little curiosity goes a long way</div><h1>First, let’s get to know your world.</h1><p class="lead">Every organization has a culture. Some are highly curated. Others grow a little more organically. Most are somewhere in between.</p><p class="lead">We’re not here to tell you what kind of culture you should have. We’re here to understand the one you’ve built, how it shapes the experiences of your people, and how we can help it grow alongside your organization.</p><p class="lead">Some questions are practical. Some are a little peculiar. All of them help us get to know the humans behind the business.</p><p class="lead"><strong>No perfect answers. No personality types. Just a conversation.</strong></p><button class="btn" id="start">Shall we?</button><p class="muted">20 playful questions, then 10 real-life scenarios. About 10–15 minutes.</p></section>'}else if(pos===30){out=snapshotMarkup()}else{const scenario=pos>=20;const idx=scenario?pos-20:pos;const item=scenario?DATA.s[idx]:DATA.q[idx];const key=(scenario?'s':'q')+idx;const chapter=scenario?'Culture in Action':item[0];const first=pos===0||(pos<20&&DATA.q[pos-1][0]!==chapter)||pos===20;const count=pos+1;const chapterIntro=first?'<div class="note"><div class="eyebrow">'+(scenario?'The real-life test':'Chapter '+(chapters.indexOf(chapter)+1))+'</div><h2>'+safe(chapter)+'</h2><p>'+safe(scenario?'Culture isn’t just what we believe. It’s what we do. Choose what would actually happen, not what sounds ideal.':subtitles[chapter])+'</p></div>':'';const choices=scenario?item[2]:item[3];out='<section class="stage"><div class="top"><span class="eyebrow">'+(scenario?'Culture in Action':'Getting to Know Your World')+'</span><span class="muted">'+count+' / 30</span></div><div class="progress" aria-label="Progress"><div class="fill" style="width:'+(count/30*100)+'%"></div></div>'+chapterIntro+'<div class="card"><div class="eyebrow">'+safe(chapter)+'</div><h2>'+safe(scenario?item[0]:item[1])+'</h2><p class="lead">'+safe(scenario?item[1]:item[2])+'</p>'+(choices.length?'<div class="options">'+choices.map((v,i)=>'<label class="opt '+(answers[key]===v?'selected':'')+'"><input type="radio" name="choice" value="'+i+'" '+(answers[key]===v?'checked':'')+'><span>'+safe(v)+'</span></label>').join('')+'</div>':'')+'<label for="more" class="muted">'+(choices.length?'Something else / It depends? Tell us more (optional)':'Dream a little. We’re listening.')+'</label><textarea id="more" placeholder="There’s usually more to the story...">'+safe(notes[key]||'')+'</textarea><div class="actions"><button class="btn alt" id="prev">Back</button><button class="btn" id="next">'+(pos===29?'Finish':'Keep going')+'</button></div></div></section>'}app.innerHTML=out;window.scrollTo(0,0);document.getElementById('start')?.addEventListener('click',()=>{pos=0;render()});document.getElementById('prev')?.addEventListener('click',()=>{pos--;render()});document.getElementById('next')?.addEventListener('click',()=>{pos++;render()});document.querySelectorAll('input[name="choice"]').forEach(x=>x.addEventListener('change',()=>{const scenario=pos>=20,idx=scenario?pos-20:pos,item=scenario?DATA.s[idx]:DATA.q[idx],choices=scenario?item[2]:item[3];answers[(scenario?'s':'q')+idx]=choices[+x.value];persist();document.querySelectorAll('.opt').forEach(y=>y.classList.toggle('selected',y.contains(x)))}));document.getElementById('more')?.addEventListener('input',e=>{notes[(pos>=20?'s':'q')+(pos>=20?pos-20:pos)]=e.target.value;persist()});document.getElementById('download')?.addEventListener('click',()=>{const rows=[...DATA.q.map((x,i)=>({stage:'Getting to Know Your World',question:x[1],answer:answers['q'+i]||'',notes:notes['q'+i]||''})),...DATA.s.map((x,i)=>({stage:'Culture in Action',question:x[0],answer:answers['s'+i]||'',notes:notes['s'+i]||''}))];const blob=new Blob([JSON.stringify(rows,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='atholhaus-culture-compass-answers.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});document.getElementById('snapshotContact')?.addEventListener('submit',e=>{e.preventDefault();contactDraft(snapshotData(),e.currentTarget)});document.getElementById('snapshotSubmission')?.addEventListener('submit',e=>{e.preventDefault();submitAssessment(e.currentTarget)});document.getElementById('printSnapshot')?.addEventListener('click',()=>window.print());document.getElementById('editAnswers')?.addEventListener('click',()=>{pos=0;render()});document.getElementById('restart')?.addEventListener('click',()=>{sessionStorage.removeItem('atholhausCompassV2');location.reload()})}render();
</script></body></html>
