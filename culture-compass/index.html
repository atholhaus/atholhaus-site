:root{--ink:#171522;--cream:#fffaf0;--green:#632bff;--accent:#dfff57;--muted:#514b5e;--pink:#ff4eae;--orange:#ff7049;--blue:#4367ff}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.55}header,main,footer{max-width:1100px;margin:auto;padding:24px}header{border-bottom:2px solid var(--ink);display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-size:1.7rem;font-weight:900;letter-spacing:-.065em;text-decoration:none;color:inherit}header a.back{color:var(--muted);font-weight:600;text-decoration:none;font-size:.9rem}header a.back:hover{color:var(--green);text-decoration:underline}h1{font-size:clamp(2.7rem,7vw,5.7rem);line-height:1.04;letter-spacing:-.065em;margin:14px 0 22px}h2{font-size:clamp(2rem,5vw,3.6rem);line-height:1.12;letter-spacing:-.05em;margin:10px 0 18px}.eyebrow{font-size:.78rem;letter-spacing:.15em;text-transform:uppercase;color:var(--green);font-weight:900}.lead{font-size:1.18rem;max-width:680px}.stage{min-height:64vh;padding:55px 0}.card{background:#fff;border:2px solid var(--ink);border-radius:26px;padding:clamp(22px,5vw,48px);box-shadow:9px 9px 0 var(--pink);max-width:820px;margin:20px auto 35px}.btn{border:2px solid var(--ink);border-radius:100px;background:var(--ink);color:white;font:800 1rem system-ui;padding:13px 24px;cursor:pointer;box-shadow:5px 5px 0 var(--orange)}.btn:hover{transform:translateY(-2px)}.btn.alt{background:var(--accent);color:var(--ink);box-shadow:5px 5px 0 var(--blue)}.btn:disabled{opacity:.35;cursor:not-allowed}.options{display:grid;gap:11px;margin:25px 0}.opt{border:2px solid var(--ink);border-radius:16px;padding:14px 18px;cursor:pointer;display:flex;gap:12px;align-items:center;background:white;font-weight:650}.opt:hover{background:#f4edff}.opt.selected{background:var(--accent);box-shadow:4px 4px 0 var(--blue)}.opt input{accent-color:var(--green);width:18px;height:18px}textarea{display:block;width:100%;min-height:95px;padding:14px;border:2px solid var(--ink);border-radius:13px;font:inherit;resize:vertical;background:white}.muted{color:var(--muted)}.actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:25px}.progress{height:9px;border:2px solid var(--ink);border-radius:30px;overflow:hidden;margin:18px 0 25px}.fill{height:100%;background:var(--green);transition:width .2s}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.note{background:var(--accent);border:2px solid var(--ink);border-radius:22px 60px 22px 22px;padding:24px;margin:24px 0;max-width:690px}.illustration{max-width:210px;width:40%;float:right;margin:0 0 15px 20px}footer{border-top:2px solid var(--ink);font-size:.86rem;color:var(--muted)}a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:3px}@media(max-width:650px){header,main,footer{padding:18px}.stage{padding:32px 0}.illustration{float:none;display:block;margin:0 auto 15px;width:60%}.card{box-shadow:6px 6px 0 var(--pink)}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><a class="brand" href="/">atholhaus.</a><a class="back" href="/">← Back to atholhaus</a></header><main><div id="app"></div></main><footer>atholhaus. · Culture is alive. · This preview saves answers only in your browser. Nothing is submitted.</footer><script>
const DATA={"q":[["The Vibe","Handshakes or High Fives?","What's the everyday energy like?",["Polished and professional","Casual and friendly","Depends on the situation","A bit of everything"]],["The Vibe","Hustle or Harmony?","When things get busy, what does great work look like?",["We push until it's done","Intense work with recovery","Efficiency over extra hours","People find their own rhythm","Depends on the season"]],["The Vibe","Suits or Sneakers?","How much room do people have to show up as themselves?",["Clear professional expectations","Individual expression is encouraged","Varies by role","We're reconsidering our norms"]],["The Vibe","Heroes or Helping Hands?","Who tends to get the biggest applause?",["Standout individual performers","Teams that deliver together","People who support others","People who prevent problems","All of the above"]],["The People","Cheers or Crickets?","Someone just accomplished something wonderful. What happens next?",["We celebrate publicly","A personal thank-you","A meaningful reward","Recognition happens informally","We could improve here"]],["The People","Spotlights or Shout-outs?","How do you figure out what makes people feel appreciated?",["We ask directly","Managers learn preferences","Consistent recognition programs","We assume similar preferences","We haven't explored this"]],["The People","Open Doors or Office Hours?","How easy is it to have a genuine conversation with leadership?",["Anyone can reach out","Regular scheduled conversations","Through managers","Varies by leader","We're improving accessibility"]],["The People","Traditions or Transitions?","What makes your workplace feel like your workplace?",["Shared traditions","Our mission and values","Relationships","Constant change and ideas","We're still discovering"]],["The Way You Work","Pings or In-Person?","How does your team stay connected and in the loop?",["Slack, Teams, or similar","Face-to-face conversations","Email","Text messages","A mix of everything","Varies by team"]],["The Way You Work","Meetings or Messages?","How does everyone get on the same page for decisions?",["We talk together","Digital discussion","Leaders decide and communicate","Clear decision-making process","Depends on the decision"]],["The Way You Work","Freedom or Frameworks?","How much room do people have to decide how they work?",["Lots of independence","Processes with room for judgment","Established procedures","Varies by role","Working toward autonomy"]],["The Way You Work","Speak Up or Stay Quiet?","When someone disagrees, what usually happens?",["We welcome conversation","Talk to their manager","Established feedback channels","Depends on topic or leader","People sometimes hesitate"]],["The Messy Middle","Fumbles or Fixes?","When someone makes a mistake, what's the first instinct?",["Solve the immediate problem","Understand what happened","Follow accountability process","Help the person learn","Depends on impact"]],["The Messy Middle","Rally or Recharge?","When pressure is on, how does your team get through it?",["Everyone pitches in","Leaders reprioritize","Established processes","Protect breaks and recovery","Push through until it settles"]],["The Messy Middle","Growing Pains or Growing Gains?","What's been the trickiest part of evolving?",["Keeping connected","Developing managers","Hiring and retention","Better systems","Preserving what's special","Several of these"]],["The Messy Middle","Rules or Relationships?","When someone's circumstances don't fit a policy, what happens?",["Follow policy consistently","Consider circumstances","Find a fair balance","Managers have discretion","Need clearer guidance"]],["The Road Ahead","Perks or Purpose?","What makes people excited to work here?",["Meaningful work","Great colleagues","Compensation and benefits","Flexibility","Career growth","We're curious ourselves"]],["The Road Ahead","Big Ideas or Baby Steps?","When someone has a different idea, what happens?",["Encourage experimentation","Small-scale tests","Review process","Change from leadership","Ideas rarely become action"]],["The Road Ahead","Roots or Rockets?","What best describes this chapter of your story?",["Growing quickly","Strengthening what we've built","Reinventing ourselves","Navigating uncertainty","Stability and sustainability"]],["The Road Ahead","Magic Wand or Moving Mountains?","If you could change one thing about your workplace tomorrow, what would it be?",[]]],"s":[["The Friday 4:45","Something important goes sideways just before the weekend.",["Everyone jumps in","Someone delegates","Follow the process","If it can wait, it waits","Depends"]],["The Unsung Hero","Someone quietly goes above and beyond, but few notice.",["Manager recognizes them","Teammates celebrate","Next check-in","Might go unnoticed","Another approach"]],["The Big Oops","A well-liked employee makes an expensive mistake.",["Fix it together","Investigate first","Manager handles privately","Accountability process","Depends"]],["The New Voice","A brand-new employee questions a long-standing process.",["We love fresh ideas","Hear them out","Explain why","Build trust first","Depends"]],["The Burnout Signal","A usually enthusiastic employee seems exhausted.",["Manager checks in","Teammate reaches out","Review workload","Wait for them to ask","May not notice"]],["The Big Win","Your team lands a major client or completes a tough project.",["Company celebration","Personal thank-you","Bonus or time off","Quick acknowledgment","Team traditions"]],["The Great Disagreement","Two respected employees disagree about a big decision.",["Work it out directly","Manager facilitates","Leadership decides","Open discussion","May linger"]],["The Missing Memo","Employees hear about a change through the grapevine.",["Clarify quickly","Managers communicate","Review gap later","Happens too often","Usually prevented"]],["The Better Offer","A valued employee has a tempting offer elsewhere.",["Ask what would help them stay","Explore growth and pay","Respect decision","Examine what's missing","Depends"]],["The Unexpected Idea","An employee proposes an unconventional improvement.",["Try it","Small test","Established review","Rarely act quickly","Depends"]]],"chapterLines":{"The Vibe":"First impressions aren't everything. But they're something.","The People":"The good stuff. The humans.","The Way You Work":"Every workplace has a system. Even if the system is chaos.","The Messy Middle":"Because even the best workplaces have Mondays.","The Road Ahead":"Still becoming. Aren't we all?"}};const chapters=[...new Set(DATA.q.map(x=>x[0]))];const subtitles=DATA.chapterLines;let pos=-1,stage=1;const saved=JSON.parse(sessionStorage.getItem('atholhausCompassPreview')||'{}');const answers=saved.answers||{},notes=saved.notes||{};const app=document.getElementById('app');const safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){sessionStorage.setItem('atholhausCompassPreview',JSON.stringify({answers,notes}))}function render(){let out='';if(pos===-1){out='<section class="stage"><img class="illustration" src="/atholhaus-robot-plant-corrected.svg" alt="atholhaus robot with plant"><div class="eyebrow">The Culture Compass · A little curiosity goes a long way</div><h1>First, let’s get to know your world.</h1><p class="lead">Every organization has a culture. Some are highly curated. Others grow a little more organically. Most are somewhere in between.</p><p class="lead">We’re not here to tell you what kind of culture you should have. We’re here to understand the one you’ve built, how it shapes the experiences of your people, and how we can help it grow alongside your organization.</p><p class="lead">Some questions are practical. Some are a little peculiar. All of them help us get to know the humans behind the business.</p><p class="lead"><strong>No perfect answers. No personality types. Just a conversation.</strong></p><button class="btn" id="start">Shall we?</button><p class="muted">20 questions, then a few real-life scenarios. Take your time.</p></section>'}else if(pos===30){out='<section class="stage"><div class="eyebrow">That’s a wrap</div><h1>Well, that was revealing.</h1><p class="lead">Thanks for letting us peek inside your world. Your answers are a starting point, not a label. Culture is alive, and the conversation is just beginning.</p><p class="lead"><strong>AI understands the resources. We understand the humans.</strong></p><button class="btn" id="download">Download my answers</button> <button class="btn alt" id="restart">Start over</button><p class="muted">This preview does not send answers to atholhaus.</p></section>'}else{const scenario=pos>=20;const idx=scenario?pos-20:pos;const item=scenario?DATA.s[idx]:DATA.q[idx];const key=(scenario?'s':'q')+idx;const chapter=scenario?'Culture in Action':item[0];const first=pos===0||(pos<20&&DATA.q[pos-1][0]!==chapter)||pos===20;const count=pos+1;const chapterIntro=first?'<div class="note"><div class="eyebrow">'+(scenario?'The real-life test':'Chapter '+(chapters.indexOf(chapter)+1))+'</div><h2>'+safe(chapter)+'</h2><p>'+safe(scenario?'Culture isn’t just what we believe. It’s what we do. No trick questions, just familiar moments.':subtitles[chapter])+'</p></div>':'';const choices=item[3]||item[2];out='<section class="stage"><div class="top"><span class="eyebrow">'+(scenario?'Culture in Action':'Getting to Know Your World')+'</span><span class="muted">'+count+' / 30</span></div><div class="progress" aria-label="Progress"><div class="fill" style="width:'+(count/30*100)+'%"></div></div>'+chapterIntro+'<div class="card"><div class="eyebrow">'+safe(chapter)+'</div><h2>'+safe(scenario?item[0]:item[1])+'</h2><p class="lead">'+safe(scenario?item[1]:item[2])+'</p>'+(choices.length?'<div class="options">'+choices.map((v,i)=>'<label class="opt '+(answers[key]===v?'selected':'')+'"><input type="radio" name="choice" value="'+i+'" '+(answers[key]===v?'checked':'')+'><span>'+safe(v)+'</span></label>').join('')+'</div>':'')+'<label for="more" class="muted">'+(choices.length?'Anything else we should know? (Optional)':'Dream a little. We’re listening.')+'</label><textarea id="more" placeholder="There’s usually more to the story...">'+safe(notes[key]||'')+'</textarea><div class="actions"><button class="btn alt" id="prev">Back</button><button class="btn" id="next">'+(pos===29?'Finish':'Keep going')+'</button></div></div></section>'}app.innerHTML=out;window.scrollTo(0,0);document.getElementById('start')?.addEventListener('click',()=>{pos=0;render()});document.getElementById('prev')?.addEventListener('click',()=>{pos--;render()});document.getElementById('next')?.addEventListener('click',()=>{pos++;render()});document.querySelectorAll('input[name="choice"]').forEach(x=>x.addEventListener('change',()=>{const scenario=pos>=20,idx=scenario?pos-20:pos,item=scenario?DATA.s[idx]:DATA.q[idx],choices=item[3]||item[2];answers[(scenario?'s':'q')+idx]=choices[+x.value];persist();document.querySelectorAll('.opt').forEach(y=>y.classList.toggle('selected',y.contains(x)))}));document.getElementById('more')?.addEventListener('input',e=>{notes[(pos>=20?'s':'q')+(pos>=20?pos-20:pos)]=e.target.value;persist()});document.getElementById('download')?.addEventListener('click',()=>{const rows=[...DATA.q.map((x,i)=>({stage:'Getting to Know Your World',question:x[1],answer:answers['q'+i]||'',notes:notes['q'+i]||''})),...DATA.s.map((x,i)=>({stage:'Culture in Action',question:x[0],answer:answers['s'+i]||'',notes:notes['s'+i]||''}))];const blob=new Blob([JSON.stringify(rows,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='atholhaus-culture-compass-answers.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});document.getElementById('restart')?.addEventListener('click',()=>{sessionStorage.removeItem('atholhausCompassPreview');location.reload()})}render();
</script></body></html>
